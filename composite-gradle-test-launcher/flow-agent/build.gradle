plugins {
    id 'java'
}

group = 'local.cgtl'
version = '0.1.66'

def byteBuddyVersion = providers.gradleProperty('byteBuddyVersion').getOrElse('1.18.7')
def dependencyRepository = providers.gradleProperty('dependencyRepository').orNull

repositories {
    if (dependencyRepository) {
        maven { url = uri(dependencyRepository) }
    } else {
        mavenCentral()
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

dependencies {
    compileOnly "net.bytebuddy:byte-buddy:${byteBuddyVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    archiveFileName = 'cgtl-flow-agent.jar'
    manifest {
        attributes(
            'Premain-Class': 'local.cgtl.flow.FlowAgent',
            'Agent-Class': 'local.cgtl.flow.FlowAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
        )
    }
}
