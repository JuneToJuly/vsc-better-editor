plugins {
    id 'java'
}

group = 'local.cgtl'
version = '0.3.11'

def byteBuddyVersion = providers.gradleProperty('byteBuddyVersion').getOrElse('1.18.7')
def dependencyRepository = providers.gradleProperty('dependencyRepository').orNull

repositories {
    if (dependencyRepository) {
        maven { url = uri(dependencyRepository) }
    } else {
        mavenCentral()
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

dependencies {
    compileOnly "net.bytebuddy:byte-buddy:${byteBuddyVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    archiveFileName = 'cgtl-flow-agent.jar'
    manifest {
        attributes(
            'Premain-Class': 'local.cgtl.flow.BootstrapAgent',
            'Agent-Class': 'local.cgtl.flow.BootstrapAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
        )
    }
}

tasks.named('jar') {
    doLast {
        def jarFile = archiveFile.get().asFile
        def required = [
            'local/cgtl/flow/BootstrapAgent.class',
            'local/cgtl/flow/FlowAgent.class',
            'local/cgtl/flow/FlowAgent$Recorder.class'
        ]
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            required.each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Flow agent JAR is missing required class: ${entry}")
                }
            }
        } finally {
            zip.close()
        }
    }
}
